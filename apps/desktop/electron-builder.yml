appId: com.zephyr110.zlog
productName: Zlog
directories:
  output: release
  buildResources: build
files:
  - dist/**/*.js
  - renderer/**/*
  - assets/tray.png
extraResources:
  # electron-builder hard-excludes a top-level "node_modules" in
  # extraResources (fileMatcher/filter.js), so the standalone tree is copied
  # in two pieces — otherwise the .pnpm store the standalone's symlinks
  # depend on would be dropped, leaving dangling links that break mac
  # signing. Result: Resources/standalone/apps/web/server.js (main.ts).
  - from: ../web/.next/standalone/apps
    to: standalone/apps
    filter:
      - "**/*"
  - from: ../web/.next/standalone/node_modules
    to: standalone/node_modules
    filter:
      - "**/*"
asar: false
mac:
  category: public.app-category.weblog
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Network
  maintainer: zephyr110
npmRebuild: false
