<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zlog</title>
  <style>
    /* ── shadcn tokens（与 apps/web/src/app/globals.css 同源）───────
       跟随系统主题：浅色为 :root，深色由 prefers-color-scheme 覆盖。 */
    :root {
      color-scheme: light;
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --muted: oklch(0.97 0 0);
      --muted-foreground: oklch(0.556 0 0);
      --accent: oklch(0.97 0 0);
      --accent-foreground: oklch(0.205 0 0);
      --destructive: oklch(0.577 0.245 27.325);
      --border: oklch(0.922 0 0);
      --input: oklch(0.922 0 0);
      --ring: oklch(0.708 0 0);
      --primary: oklch(0.205 0 0);
      --primary-foreground: oklch(0.985 0 0);
      --radius: 0.625rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --accent: oklch(0.269 0 0);
        --accent-foreground: oklch(0.985 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --border: oklch(1 0 0 / 10%);
        --input: oklch(1 0 0 / 15%);
        --ring: oklch(0.556 0 0);
        --primary: oklch(0.922 0 0);
        --primary-foreground: oklch(0.205 0 0);
      }
    }

    /* ── 基础 ─────────────────────────────────────────────────────── */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 24px 24px;
      background: var(--background);
      color: var(--foreground);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      /* 轻量入场：140ms 上浮渐隐；尊重系统减弱动效设置 */
      animation: rise-in 0.14s ease-out;
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
    }

    /* ── 品牌头部（居中） ─────────────────────────────────────────── */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: calc(var(--radius) * 1.4); /* rounded-xl */
      box-shadow: 0 1px 2px oklch(0 0 0 / 0.08);
    }
    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--muted-foreground);
      text-align: center;
    }

    /* ── 分区分隔 ─────────────────────────────────────────────────── */
    .divider {
      margin: 0 0 22px;
      border: 0;
      border-top: 1px solid var(--border);
    }

    /* ── 区块 ─────────────────────────────────────────────────────── */
    .section { display: flex; flex-direction: column; gap: 16px; }
    .section + .section { margin-top: 22px; }
    .section-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.005em;
    }
    .section-title .tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted-foreground);
    }
    .section-title .tag.req { color: var(--destructive); }

    .field { display: flex; flex-direction: column; }
    label {
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    input {
      width: 100%;
      height: 36px; /* shadcn input h-9 */
      padding: 0 12px;
      font: inherit;
      color: var(--foreground);
      background: var(--background);
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px); /* rounded-md */
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input::placeholder { color: var(--muted-foreground); opacity: 0.6; }
    input:hover { border-color: oklch(0.708 0 0); }
    input:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
    }
    input[aria-invalid="true"] {
      border-color: var(--destructive);
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px color-mix(in oklch, var(--destructive) 35%, transparent);
    }
    .hint {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted-foreground);
    }
    a {
      color: var(--primary);
      text-decoration: none;
      border-radius: 2px;
    }
    a:hover { text-decoration: underline; }
    a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
    }

    /* ── 状态区（min-height 防布局跳动） ─────────────────────────── */
    .status {
      min-height: 40px;
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted-foreground);
      white-space: pre-line;
    }
    .status.error { color: var(--destructive); }

    /* ── 操作区：全宽主 CTA + 次要链接 ───────────────────────────── */
    #saveBtn {
      width: 100%;
      height: 40px; /* 主 CTA 略高，视觉主导 */
      padding: 0 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--primary-foreground);
      background: var(--primary);
      border: 1px solid transparent;
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
      outline: none;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }
    #saveBtn:hover:not(:disabled) { background: color-mix(in oklch, var(--primary) 90%, var(--background)); }
    #saveBtn:focus-visible {
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
    }
    #saveBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    .secondary-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 12px;
    }
    .secondary-row button {
      padding: 0;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground);
      background: none;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      outline: none;
    }
    .secondary-row button:hover { color: var(--foreground); text-decoration: underline; }
    .secondary-row button:focus-visible {
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
    }
    .secondary-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header class="brand">
    <img class="brand-logo" src="../assets/tray.png" alt="" />
    <h1 id="title">Zlog 首次设置</h1>
    <p class="subtitle" id="subtitle">
      创建管理员账号；同步可稍后在设置中补充（可选）。
    </p>
  </header>

  <hr class="divider" />

  <div class="section">
    <h2 class="section-title">管理员账号<span class="tag req">必填</span></h2>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" autocomplete="username" placeholder="admin" />
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="new-password" />
    </div>
    <div class="field">
      <label for="password2">确认密码</label>
      <input id="password2" type="password" autocomplete="new-password" />
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">同步设置<span class="tag">可选</span></h2>
    <div class="field">
      <label for="syncUrl">数据库 URL</label>
      <input id="syncUrl" placeholder="libsql://your-db.turso.io" />
      <p class="hint">
        从 Turso 控制台复制数据库 URL；不填则纯本地运行，之后可补。
        <a href="https://docs.turso.tech/tursodb/quickstart" target="_blank" rel="noopener">创建数据库指南 →</a>
      </p>
    </div>
    <div class="field">
      <label for="syncToken">同步 Token</label>
      <input id="syncToken" type="password" placeholder="eyJ..." />
      <p class="hint">
        在 Turso 控制台创建 API Token。
        <a href="https://docs.turso.tech/cli/db/tokens/create" target="_blank" rel="noopener">Token 文档 →</a>
      </p>
    </div>
    <p class="hint" style="margin-top: 0">
      没有 Turso 账号？
      <a href="https://app.turso.tech" target="_blank" rel="noopener">注册 / 登录 Turso 控制台 →</a>
    </p>
  </div>

  <div class="status" id="status" aria-live="polite"></div>

  <button id="saveBtn">保存并启动</button>
  <div class="secondary-row">
    <button id="syncBtn">立即同步</button>
    <button id="openBtn">打开数据目录</button>
  </div>

  <script src="./settings.js"></script>
</body>
</html>
